<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tipificaciones · Soporte</title>
</head>
<body style="margin:0;background:#0b0d12;color:#e2e8f8;font-family:Arial,sans-serif">
<div style="padding:24px">Cargando tipificaciones…</div>
<script>
(async()=>{
  const ORIGINAL='https://raw.githubusercontent.com/alexis-alzate/tipificaciones-soporte/a1ec6c34d17f84a6e51fae4dec4221ec82f6172d/index.html';
  try{
    let html=await fetch(ORIGINAL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('No se pudo cargar la base');return r.text()});
    const css=`<style>
      .coord-btn,.new-tip-btn{flex-shrink:0;padding:9px 13px;border-radius:9px;font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;cursor:pointer}
      .coord-btn{border:1px solid var(--border2);background:var(--surface2);color:var(--muted)}
      .new-tip-btn{border:1px solid rgba(34,208,122,.4);background:rgba(34,208,122,.12);color:#79edaf;display:none}
      .admin-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:12000;align-items:center;justify-content:center;padding:16px}.admin-overlay.show{display:flex}
      .admin-modal{width:500px;max-width:94vw;background:var(--surface2);border:1px solid var(--border2);border-radius:14px;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.65)}
      .admin-modal h3{font-size:17px;margin:0 0 6px}.admin-modal p{font-size:13px;color:var(--muted);margin:0 0 18px;line-height:1.5}
      .admin-label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}.admin-field{width:100%;box-sizing:border-box;background:var(--bg);border:1.5px solid var(--border2);border-radius:8px;color:var(--text);font-family:'Outfit',sans-serif;font-size:14px;padding:10px 12px;outline:none}
      .admin-preview{margin-top:14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:11px 12px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
      .admin-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.admin-action{padding:9px 18px;border-radius:8px;border:0;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer}.admin-cancel{background:var(--border2);color:var(--muted)}.admin-primary{background:var(--accent);color:white}.admin-save{background:var(--green);color:#07140d}.admin-error{min-height:18px;color:#ff7c93;font-size:12px;margin-top:10px}
      @media(max-width:820px){header{flex-wrap:wrap}.coord-btn,.new-tip-btn{order:4}}
    </style>`;
    const lib='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"><\\/script>';
    const js=`<script>
    (async()=>{
      const SUPABASE_URL='https://ocnoiraaqosfmbluccba.supabase.co';
      const SUPABASE_KEY='sb_publishable_0l5G3JLG4dXy91KUmMPPAg_cKgxVlvt';
      const COORDINATOR_EMAIL='jarias.playtechla@gmail.com';
      const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,detectSessionInUrl:true}});
      const norm=s=>(s||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().trim();
      const header=document.querySelector('header');if(!header)return;
      const coordBtn=document.createElement('button');coordBtn.className='coord-btn';coordBtn.type='button';
      const newBtn=document.createElement('button');newBtn.className='new-tip-btn';newBtn.type='button';newBtn.textContent='＋ Nueva tipificación';
      const count=document.getElementById('result-count');header.insertBefore(coordBtn,count||null);header.insertBefore(newBtn,count||null);

      const login=document.createElement('div');login.className='admin-overlay';login.innerHTML='<div class="admin-modal"><h3>🔐 Acceso coordinador</h3><p>El enlace de acceso se enviará únicamente al correo autorizado.</p><label class="admin-label">Correo autorizado</label><input class="admin-field" value="'+COORDINATOR_EMAIL+'" readonly><div class="admin-error" id="login-error"></div><div class="admin-actions"><button class="admin-action admin-cancel" id="login-cancel">Cancelar</button><button class="admin-action admin-primary" id="login-send">Enviar enlace de acceso</button></div></div>';document.body.appendChild(login);
      const add=document.createElement('div');add.className='admin-overlay';add.innerHTML='<div class="admin-modal"><h3>➕ Nueva tipificación</h3><p>Se guardará para todo el equipo.</p><label class="admin-label">Categoría</label><select class="admin-field" id="shared-category"></select><label class="admin-label">Tipificación / ruta</label><input class="admin-field" id="shared-left" placeholder="Ej: Configuraciones-usuarios-administrar usuarios"><label class="admin-label">Descripción</label><input class="admin-field" id="shared-right" placeholder="Ej: Se cambia correo del usuario"><div class="admin-preview" id="shared-preview">La vista previa aparecerá aquí.</div><div class="admin-error" id="shared-error"></div><div class="admin-actions"><button class="admin-action admin-cancel" id="shared-cancel">Cancelar</button><button class="admin-action admin-save" id="shared-save">Guardar para todos</button></div></div>';document.body.appendChild(add);

      let coordinator=false;
      async function refreshAuth(){const {data}=await client.auth.getSession();const email=(data.session?.user?.email||'').toLowerCase();coordinator=email===COORDINATOR_EMAIL;newBtn.style.display=coordinator?'inline-block':'none';coordBtn.textContent=coordinator?'🔓 Coordinador':'🔐 Coordinador'}
      coordBtn.addEventListener('click',async()=>{if(coordinator){await client.auth.signOut();await refreshAuth();toast('Sesión de coordinador cerrada');return}document.getElementById('login-error').textContent='';login.classList.add('show')});
      document.getElementById('login-cancel').onclick=()=>login.classList.remove('show');
      document.getElementById('login-send').onclick=async()=>{const err=document.getElementById('login-error');err.textContent='Enviando…';const {error}=await client.auth.signInWithOtp({email:COORDINATOR_EMAIL,options:{shouldCreateUser:true,emailRedirectTo:location.origin+'/app.html'}});err.textContent=error?error.message:'Revisa el correo del coordinador y abre el enlace de acceso.'};

      const cat=document.getElementById('shared-category'),left=document.getElementById('shared-left'),right=document.getElementById('shared-right'),preview=document.getElementById('shared-preview'),sharedErr=document.getElementById('shared-error');
      const updatePreview=()=>{const l=left.value.trim(),r=right.value.trim();preview.textContent=(l||r)?((l||'Tipificación')+'='+(r||'Descripción')):'La vista previa aparecerá aquí.'};left.oninput=updatePreview;right.oninput=updatePreview;
      newBtn.onclick=()=>{if(!coordinator)return;cat.innerHTML=CATEGORIES.map(c=>'<option value="'+c.id+'">'+c.label+'</option>').join('');if(activeCategory!=='all'&&CATEGORIES.some(c=>c.id===activeCategory))cat.value=activeCategory;left.value='';right.value='';sharedErr.textContent='';updatePreview();add.classList.add('show')};document.getElementById('shared-cancel').onclick=()=>add.classList.remove('show');
      document.getElementById('shared-save').onclick=async()=>{const c=CATEGORIES.find(x=>x.id===cat.value),l=left.value.trim(),r=right.value.trim();if(!c||!l||!r){sharedErr.textContent='Completa todos los campos.';return}const text=l+'='+r;if(c.items.some(i=>norm(i.text)===norm(text))){sharedErr.textContent='Esa tipificación ya existe.';return}const {error}=await client.from('playtech_tipificaciones').insert({category_id:c.id,text,is_template:text.includes('LIST-XXXX'),created_by_email:COORDINATOR_EMAIL});if(error){sharedErr.textContent=error.message;return}add.classList.remove('show');await loadShared();activeCategory=c.id;searchQuery='';document.getElementById('search').value='';render();toast('Tipificación compartida guardada ✓')};

      async function loadShared(){const {data,error}=await client.from('playtech_tipificaciones').select('id,category_id,text,is_template').order('created_at',{ascending:true});if(error){console.warn(error);return}let changed=false;(data||[]).forEach(row=>{const c=CATEGORIES.find(x=>x.id===row.category_id);if(c&&!c.items.some(i=>norm(i.text)===norm(row.text))){c.items.push({text:row.text,isTemplate:!!row.is_template});changed=true}});if(changed)render()}
      await refreshAuth();await loadShared();client.auth.onAuthStateChange(()=>refreshAuth());client.channel('playtech-tipificaciones').on('postgres_changes',{event:'INSERT',schema:'public',table:'playtech_tipificaciones'},()=>loadShared()).subscribe();
    })();
    <\\/script>`;
    html=html.replace('</head>',css+lib+'</head>').replace('</body>',js+'</body>');document.open();document.write(html);document.close();
  }catch(e){document.body.innerHTML='<div style="padding:24px">No se pudo cargar la herramienta. Recarga la página.</div>';console.error(e)}
})();
</script>
</body>
</html>
