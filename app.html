<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tipificaciones · Soporte</title>
</head>
<body style="margin:0;background:#0b0d12;color:#e2e8f8;font-family:Arial,sans-serif">
<div style="padding:24px">Cargando tipificaciones…</div>
<script>
(async()=>{
  const ORIGINAL='https://raw.githubusercontent.com/alexis-alzate/tipificaciones-soporte/a1ec6c34d17f84a6e51fae4dec4221ec82f6172d/index.html';
  try {
    let html=await fetch(ORIGINAL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('No se pudo cargar la base');return r.text()});
    const css=`<style>
      .coord-btn,.new-tip-btn{flex-shrink:0;padding:9px 13px;border-radius:9px;font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
      .coord-btn{border:1px solid var(--border2);background:var(--surface2);color:var(--muted)}
      .coord-btn:hover{border-color:var(--accent);color:var(--text)}
      .new-tip-btn{border:1px solid rgba(34,208,122,.4);background:rgba(34,208,122,.12);color:#79edaf;display:none}
      .new-tip-btn:hover{background:rgba(34,208,122,.2)}
      .admin-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:12000;align-items:center;justify-content:center;padding:16px}.admin-overlay.show{display:flex}
      .admin-modal{width:500px;max-width:94vw;background:var(--surface2);border:1px solid var(--border2);border-radius:14px;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.65)}
      .admin-modal h3{font-size:17px;margin:0 0 6px}.admin-modal p{font-size:13px;color:var(--muted);margin:0 0 18px;line-height:1.5}
      .admin-label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
      .admin-field{width:100%;box-sizing:border-box;background:var(--bg);border:1.5px solid var(--border2);border-radius:8px;color:var(--text);font-family:'Outfit',sans-serif;font-size:14px;padding:10px 12px;outline:none}.admin-field:focus{border-color:var(--accent)}
      .admin-preview{margin-top:14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:11px 12px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);word-break:break-word}
      .admin-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.admin-action{padding:9px 18px;border-radius:8px;border:0;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer}.admin-cancel{background:var(--border2);color:var(--muted)}.admin-primary{background:var(--accent);color:white}.admin-save{background:var(--green);color:#07140d}.admin-error{min-height:18px;color:#ff7c93;font-size:12px;margin-top:10px}
      .tip-edit-btn{flex-shrink:0;border:1px solid rgba(61,127,255,.38);background:rgba(61,127,255,.12);color:#8fb4ff;border-radius:7px;padding:5px 9px;font-family:'Outfit',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:.15s}
      .tip-edit-btn:hover{background:rgba(61,127,255,.22);border-color:rgba(61,127,255,.65)}
      @media(max-width:820px){header{flex-wrap:wrap}.coord-btn,.new-tip-btn{order:4}}
    </style>`;
    const js=`<script>
    (()=>{
      const SUPABASE_URL='https://ocnoiraaqosfmbluccba.supabase.co';
      const SUPABASE_KEY='sb_publishable_0l5G3JLG4dXy91KUmMPPAg_cKgxVlvt';
      const COORDINATOR_EMAIL='jarias.playtechla@gmail.com';
      const FUNCTION_URL=SUPABASE_URL+'/functions/v1/playtech-add-tipificacion';
      const TABLE_URL=SUPABASE_URL+'/rest/v1/playtech_tipificaciones?select=id,category_id,text,is_template,created_at&order=created_at.asc';
      const EDITS_URL=SUPABASE_URL+'/rest/v1/playtech_tipificacion_edits?select=id,original_category_id,original_text,category_id,text,is_template,updated_at&order=updated_at.asc';
      const norm=s=>(s||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().trim();
      normalize=function(str){return String(str??'').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[\\u200B-\\u200D\\uFEFF]/g,'').replace(/\\s+/g,' ').replace(/\\s*=\\s*/g,'=').trim()};
      CATEGORIES.forEach(category=>category.items.forEach(item=>{item._sourceKind='original';item._originalCategoryId=category.id;item._originalText=item.text;}));
      let coordinatorPassword='';let coordinatorActive=false;let editingItem=null;let editingCategory=null;
      const header=document.querySelector('header');if(!header)return;
      const coordBtn=document.createElement('button');coordBtn.type='button';coordBtn.className='coord-btn';coordBtn.textContent='🔐 Coordinador';
      const newBtn=document.createElement('button');newBtn.type='button';newBtn.className='new-tip-btn';newBtn.textContent='＋ Nueva tipificación';
      const resultCount=document.getElementById('result-count');header.insertBefore(coordBtn,resultCount||null);header.insertBefore(newBtn,resultCount||null);
      const login=document.createElement('div');login.className='admin-overlay';login.innerHTML='<div class="admin-modal"><h3>🔐 Acceso coordinador</h3><p>Solo el coordinador autorizado puede agregar y modificar tipificaciones para todo el equipo.</p><label class="admin-label">Correo</label><input class="admin-field" value="'+COORDINATOR_EMAIL+'" readonly><label class="admin-label">Clave de coordinador</label><input id="coord-password" class="admin-field" type="password" autocomplete="current-password" placeholder="Ingresa la clave"><div id="coord-error" class="admin-error"></div><div class="admin-actions"><button id="coord-cancel" type="button" class="admin-action admin-cancel">Cancelar</button><button id="coord-login" type="button" class="admin-action admin-primary">Entrar</button></div></div>';document.body.appendChild(login);
      const add=document.createElement('div');add.className='admin-overlay';add.innerHTML='<div class="admin-modal"><h3>➕ Nueva tipificación</h3><p>Lo que guardes aquí aparecerá para todo el equipo.</p><label class="admin-label">Categoría</label><select id="shared-category" class="admin-field"></select><label class="admin-label">Tipificación / ruta</label><input id="shared-left" class="admin-field" placeholder="Ej: Configuraciones-usuarios-administrar usuarios"><label class="admin-label">Descripción</label><input id="shared-right" class="admin-field" placeholder="Ej: Se cambia correo del usuario"><div id="shared-preview" class="admin-preview">La vista previa aparecerá aquí.</div><div id="shared-error" class="admin-error"></div><div class="admin-actions"><button id="shared-cancel" type="button" class="admin-action admin-cancel">Cancelar</button><button id="shared-save" type="button" class="admin-action admin-save">Guardar para todos</button></div></div>';document.body.appendChild(add);
      const edit=document.createElement('div');edit.className='admin-overlay';edit.innerHTML='<div class="admin-modal"><h3>✏️ Modificar tipificación</h3><p>El cambio reemplazará esta tipificación para todo el equipo.</p><label class="admin-label">Categoría</label><select id="edit-category" class="admin-field"></select><label class="admin-label">Tipificación / ruta</label><input id="edit-left" class="admin-field"><label class="admin-label">Descripción</label><input id="edit-right" class="admin-field"><div id="edit-preview" class="admin-preview"></div><div id="edit-error" class="admin-error"></div><div class="admin-actions"><button id="edit-cancel" type="button" class="admin-action admin-cancel">Cancelar</button><button id="edit-save" type="button" class="admin-action admin-save">Guardar cambios</button></div></div>';document.body.appendChild(edit);
      async function api(payload){const res=await fetch(FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify(payload)});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data.error||'No se pudo completar la operación');return data}
      function currentCategoryForItem(item){return CATEGORIES.find(category=>category.items.includes(item))||null}
      function moveItem(item,targetCategory){const current=currentCategoryForItem(item);if(current&&current!==targetCategory){current.items.splice(current.items.indexOf(item),1);targetCategory.items.push(item)}}
      function categoryFromCard(card){return [...CATEGORIES].sort((a,b)=>b.id.length-a.id.length).find(category=>card.id.startsWith('c_'+category.id+'_'))||null}
      function itemFromCard(card){const category=categoryFromCard(card);if(!category)return null;const text=card.querySelector('.tip-text')?.textContent||'';return category.items.find(item=>norm(item.text)===norm(text))||null}
      function decorateEditButtons(){if(!coordinatorActive)return;document.querySelectorAll('.tip-card').forEach(card=>{if(card.querySelector('.tip-edit-btn'))return;const item=itemFromCard(card);if(!item)return;const button=document.createElement('button');button.type='button';button.className='tip-edit-btn';button.textContent='✏ Editar';button.title='Modificar esta tipificación';button.onclick=e=>{e.preventDefault();e.stopPropagation();openEdit(item)};card.appendChild(button)})}
      const originalRender=render;
      render=function(){originalRender();if(coordinatorActive)decorateEditButtons()};
      function setCoordinator(active){coordinatorActive=active;coordBtn.textContent=active?'🔓 Coordinador':'🔐 Coordinador';newBtn.style.display=active?'inline-block':'none';if(!active)coordinatorPassword='';render()}
      coordBtn.onclick=()=>{if(coordinatorActive){setCoordinator(false);toast('Sesión de coordinador cerrada');return}document.getElementById('coord-password').value='';document.getElementById('coord-error').textContent='';login.classList.add('show');setTimeout(()=>document.getElementById('coord-password').focus(),50)};
      document.getElementById('coord-cancel').onclick=()=>login.classList.remove('show');
      document.getElementById('coord-login').onclick=async()=>{const password=document.getElementById('coord-password').value,error=document.getElementById('coord-error');if(!password){error.textContent='Escribe la clave de coordinador.';return}error.textContent='Validando…';try{await api({action:'verify',email:COORDINATOR_EMAIL,password});coordinatorPassword=password;setCoordinator(true);login.classList.remove('show');toast('Acceso de coordinador habilitado ✓')}catch(e){error.textContent=e.message}};
      document.getElementById('coord-password').onkeydown=e=>{if(e.key==='Enter')document.getElementById('coord-login').click();if(e.key==='Escape')login.classList.remove('show')};
      const cat=document.getElementById('shared-category'),left=document.getElementById('shared-left'),right=document.getElementById('shared-right'),preview=document.getElementById('shared-preview'),sharedError=document.getElementById('shared-error');
      function updatePreview(){const l=left.value.trim(),r=right.value.trim();preview.textContent=(l||r)?((l||'Tipificación')+'='+(r||'Descripción')):'La vista previa aparecerá aquí.'}left.oninput=updatePreview;right.oninput=updatePreview;
      const editCat=document.getElementById('edit-category'),editLeft=document.getElementById('edit-left'),editRight=document.getElementById('edit-right'),editPreview=document.getElementById('edit-preview'),editError=document.getElementById('edit-error');
      function updateEditPreview(){const l=editLeft.value.trim(),r=editRight.value.trim();editPreview.textContent=(l||r)?((l||'Tipificación')+'='+(r||'Descripción')):'La vista previa aparecerá aquí.'}editLeft.oninput=updateEditPreview;editRight.oninput=updateEditPreview;
      function openEdit(item){if(!coordinatorActive)return;editingItem=item;editingCategory=currentCategoryForItem(item);if(!editingCategory)return;editCat.innerHTML=CATEGORIES.map(category=>'<option value="'+category.id+'">'+category.label+'</option>').join('');editCat.value=editingCategory.id;const pos=item.text.indexOf('=');editLeft.value=pos>=0?item.text.slice(0,pos):item.text;editRight.value=pos>=0?item.text.slice(pos+1):'';editError.textContent='';updateEditPreview();edit.classList.add('show');setTimeout(()=>editLeft.focus(),50)}
      document.getElementById('edit-cancel').onclick=()=>edit.classList.remove('show');
      document.getElementById('edit-save').onclick=async()=>{if(!editingItem||!editingCategory)return;const target=CATEGORIES.find(category=>category.id===editCat.value),l=editLeft.value.trim(),r=editRight.value.trim();if(!target||!l||!r){editError.textContent='Completa todos los campos.';return}const text=l+'='+r;if(target.items.some(item=>item!==editingItem&&norm(item.text)===norm(text))){editError.textContent='Ya existe una tipificación igual en esa categoría.';return}const payload={action:'edit',email:COORDINATOR_EMAIL,password:coordinatorPassword,category_id:target.id,text,is_template:text.includes('LIST-XXXX')};if(editingItem._sourceKind==='shared'){payload.source_kind='shared';payload.source_id=editingItem._sharedId}else{payload.source_kind='original';payload.original_category_id=editingItem._originalCategoryId;payload.original_text=editingItem._originalText}editError.textContent='Guardando cambios…';try{await api(payload);moveItem(editingItem,target);editingItem.text=text;editingItem.isTemplate=text.includes('LIST-XXXX');edit.classList.remove('show');activeCategory=target.id;searchQuery='';document.getElementById('search').value='';render();toast('Tipificación modificada para todos ✓')}catch(e){editError.textContent=e.message}};
      newBtn.onclick=()=>{if(!coordinatorActive)return;cat.innerHTML=CATEGORIES.map(c=>'<option value="'+c.id+'">'+c.label+'</option>').join('');if(activeCategory!=='all'&&CATEGORIES.some(c=>c.id===activeCategory))cat.value=activeCategory;left.value='';right.value='';sharedError.textContent='';updatePreview();add.classList.add('show');setTimeout(()=>left.focus(),50)};
      document.getElementById('shared-cancel').onclick=()=>add.classList.remove('show');
      document.getElementById('shared-save').onclick=async()=>{const category=CATEGORIES.find(c=>c.id===cat.value),l=left.value.trim(),r=right.value.trim();if(!category||!l||!r){sharedError.textContent='Completa todos los campos.';return}const text=l+'='+r;if(category.items.some(i=>norm(i.text)===norm(text))){sharedError.textContent='Esa tipificación ya existe.';return}sharedError.textContent='Guardando…';try{await api({action:'insert',email:COORDINATOR_EMAIL,password:coordinatorPassword,category_id:category.id,text,is_template:text.includes('LIST-XXXX')});add.classList.remove('show');await loadShared();activeCategory=category.id;searchQuery='';document.getElementById('search').value='';render();toast('Tipificación guardada para todos ✓')}catch(e){sharedError.textContent=e.message}};
      async function loadOriginalEdits(){try{const res=await fetch(EDITS_URL,{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}});if(!res.ok)throw new Error('No se pudieron cargar las modificaciones');const rows=await res.json();for(const row of rows){let item=null;for(const category of CATEGORIES){item=category.items.find(candidate=>candidate._sourceKind==='original'&&candidate._originalCategoryId===row.original_category_id&&candidate._originalText===row.original_text);if(item)break}if(!item)continue;const target=CATEGORIES.find(category=>category.id===row.category_id);if(!target)continue;moveItem(item,target);item.text=row.text;item.isTemplate=!!row.is_template}}catch(e){console.warn('Modificaciones de tipificaciones:',e)}}
      async function loadShared(){try{const res=await fetch(TABLE_URL,{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}});if(!res.ok)throw new Error('No se pudieron cargar las compartidas');const rows=await res.json();for(const row of rows){let item=null;for(const category of CATEGORIES){item=category.items.find(candidate=>candidate._sourceKind==='shared'&&candidate._sharedId===row.id);if(item)break}const target=CATEGORIES.find(category=>category.id===row.category_id);if(!target)continue;if(!item){item={text:row.text,isTemplate:!!row.is_template,_sourceKind:'shared',_sharedId:row.id};target.items.push(item)}else{moveItem(item,target);item.text=row.text;item.isTemplate=!!row.is_template}}}catch(e){console.warn('Tipificaciones compartidas:',e)}}
      async function loadAll(){await loadOriginalEdits();await loadShared();render()}
      login.onclick=e=>{if(e.target===login)login.classList.remove('show')};add.onclick=e=>{if(e.target===add)add.classList.remove('show')};edit.onclick=e=>{if(e.target===edit)edit.classList.remove('show')};loadAll();setInterval(loadAll,30000);
    })();
    <\/script>`;
    html=html.replace('</head>',css+'</head>').replace('</body>',js+'</body>');
    document.open();document.write(html);document.close();
  } catch(e) {
    console.error(e);
    document.body.innerHTML='<div style="padding:24px">No se pudo cargar la herramienta. Recarga la página.</div>';
  }
})();
</script>
</body>
</html>
