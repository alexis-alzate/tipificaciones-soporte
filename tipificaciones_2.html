<html lang="es">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d12;
    --surface: #12151e;
    --surface2: #181c28;
    --border: #1e2435;
    --border2: #252c42;
    --text: #e2e8f8;
    --muted: #6b7a9e;
    --accent: #3d7fff;
    --accent-glow: rgba(61,127,255,0.18);
    --green: #22d07a;
    --orange: #ff8c42;
    --red: #ff4d6d;
    --purple: #a78bfa;
    --cyan: #22d3ee;
    --amber: #fbbf24;
    --pink: #f472b6;
    --teal: #2dd4bf;
    --indigo: #818cf8;
    --radius: 10px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* HEADER */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-shrink: 0;
    z-index: 10;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .logo-icon {
    width: 34px; height: 34px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .logo-text {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--text);
  }
  .logo-sub {
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .search-wrap {
    flex: 1;
    position: relative;
    max-width: 640px;
  }
  .search-icon {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 16px;
    pointer-events: none;
  }
  #search {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--border2);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    padding: 10px 14px 10px 42px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  #search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  #search::placeholder { color: var(--muted); }

  .count-badge {
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--muted);
    flex-shrink: 0;
  }
  .count-badge span { color: var(--accent); font-weight: 600; }

  /* LAYOUT */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* SIDEBAR */
  aside {
    width: 230px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  aside::-webkit-scrollbar { width: 4px; }
  aside::-webkit-scrollbar-track { background: transparent; }
  aside::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  .sidebar-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 8px 10px 4px;
  }
  .cat-btn {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 400;
    text-align: left;
    width: 100%;
  }
  .cat-btn:hover { background: var(--surface2); color: var(--text); }
  .cat-btn.active {
    background: var(--accent-glow);
    color: var(--text);
    font-weight: 500;
  }
  .cat-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .cat-count {
    margin-left: auto;
    font-size: 11px;
    background: var(--border2);
    border-radius: 10px;
    padding: 1px 7px;
    color: var(--muted);
  }
  .cat-btn.active .cat-count { background: var(--accent); color: #fff; }

  /* MAIN */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }
  main::-webkit-scrollbar { width: 5px; }
  main::-webkit-scrollbar-track { background: transparent; }
  main::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  .section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    margin-top: 22px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title:first-child { margin-top: 0; }
  .section-dot { width: 8px; height: 8px; border-radius: 50%; }

  .items-grid {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 6px;
  }

  .tip-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .1s;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .tip-card:hover {
    background: var(--surface2);
    border-color: var(--border2);
    transform: translateX(2px);
  }
  .tip-card.copied {
    border-color: var(--green);
    background: rgba(34,208,122,0.06);
  }
  .tip-card.has-template { border-color: rgba(251,191,36,0.3); }
  .tip-card.has-template:hover { background: rgba(251,191,36,0.04); }

  .tip-main { flex: 1; min-width: 0; }
  .tip-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--text);
    line-height: 1.5;
    word-break: break-word;
  }
  .part-module { color: var(--cyan); }
  .part-sub { color: var(--purple); }
  .part-action { color: var(--text); }
  .part-sep { color: var(--muted); }
  .part-placeholder { color: var(--amber); font-style: italic; }

  .tip-copy-icon {
    color: var(--muted);
    font-size: 14px;
    flex-shrink: 0;
    transition: color .15s;
    opacity: 0;
  }
  .tip-card:hover .tip-copy-icon { opacity: 1; color: var(--accent); }
  .tip-card.copied .tip-copy-icon { opacity: 1; color: var(--green); }

  .template-badge {
    background: rgba(251,191,36,0.12);
    border: 1px solid rgba(251,191,36,0.3);
    color: var(--amber);
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    letter-spacing: 0.05em;
    flex-shrink: 0;
  }

  /* EMPTY */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }
  .empty-icon { font-size: 48px; margin-bottom: 16px; }
  .empty h3 { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 8px; }

  /* TOAST */
  #toast {
    position: fixed;
    bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--green);
    color: #000;
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 22px;
    border-radius: 30px;
    z-index: 9999;
    transition: transform .3s cubic-bezier(0.34,1.56,0.64,1), opacity .3s;
    opacity: 0;
    pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* MODAL */
  #modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  #modal-overlay.show { display: flex; }
  #modal {
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 14px;
    padding: 28px;
    width: 500px;
    max-width: 92vw;
    box-shadow: 0 24px 60px rgba(0,0,0,0.6);
  }
  #modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  #modal p { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  .modal-preview {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 16px;
    word-break: break-word;
    line-height: 1.6;
  }
  .modal-preview .filled { color: var(--amber); font-weight: 600; }
  #ticket-input {
    width: 100%;
    background: var(--bg);
    border: 1.5px solid var(--border2);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    padding: 10px 14px;
    outline: none;
    margin-bottom: 16px;
    transition: border-color .2s;
  }
  #ticket-input:focus { border-color: var(--amber); }
  #ticket-input::placeholder { color: var(--muted); }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; }
  .btn {
    padding: 9px 20px;
    border-radius: 8px;
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: opacity .15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn-cancel { background: var(--border2); color: var(--muted); }
  .btn-copy { background: var(--amber); color: #000; }

  mark {
    background: rgba(61,127,255,0.22);
    color: var(--accent);
    border-radius: 2px;
    padding: 0 1px;
  }
</style>
</head>

<header>
  <div class="logo">

    </div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>

  </div>
  <div class="count-badge" id="result-count" style="display:none"><span id="count-num">0</span> resultados</div>
</header>

<div class="layout">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>

<div id="toast"></div>

<div id="modal-overlay">
  <div id="modal">
    <h3>🎫 Número de ticket</h3>
    <p>Esta tipificación requiere el número del ticket de novedad. Escríbelo abajo y se insertará automáticamente.</p>
    <div class="modal-preview" id="modal-preview"></div>
    <input type="text" id="ticket-input" placeholder="Ej: LIST-1234" maxlength="20">
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-copy" onclick="confirmTicket()">Copiar tipificación ⎘</button>
    </div>
  </div>
</div>

function normalize(str) {
  return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function highlight(text, query) {
  if (!query) return escHtml(text);
  const nq = normalize(query);
  const nt = normalize(text);
  let result = '';
  let i = 0;
  const etext = escHtml(text);
  // Work on original text, match positions
  const positions = [];
  let pos = nt.indexOf(nq);
  while (pos !== -1) {
    positions.push(pos);
    pos = nt.indexOf(nq, pos + 1);
  }
  if (positions.length === 0) return etext;
  let last = 0;
  positions.forEach(p => {
    result += escHtml(text.slice(last, p));
    result += '<mark>' + escHtml(text.slice(p, p + query.length)) + '</mark>';
    last = p + query.length;
  });
  result += escHtml(text.slice(last));
  return result;
}

function formatTipText(text, query) {
  const eqIdx = text.indexOf('=');
  if (eqIdx === -1) return highlight(text, query);
  const left = text.slice(0, eqIdx);
  const right = text.slice(eqIdx + 1);
  const parts = left.split('-');
  let html = '';
  parts.forEach((p, i) => {
    const cls = i === 0 ? 'part-module' : 'part-sub';
    html += `<span class="${cls}">${highlight(p, query)}</span>`;
    if (i < parts.length - 1) html += `<span class="part-sep">-</span>`;
  });
  html += `<span class="part-sep">=</span>`;
  if (text.includes('LIST-XXXX')) {
    const sides = right.split('LIST-XXXX');
    html += sides.map((p, i) =>
      i < sides.length - 1
        ? `<span class="part-action">${highlight(p, query)}</span><span class="part-placeholder">LIST-XXXX</span>`
        : `<span class="part-action">${highlight(p, query)}</span>`
    ).join('');
  } else {
    html += `<span class="part-action">${highlight(right, query)}</span>`;
  }
  return html;
}

function matches(item, q) {
  if (!q) return true;
  return normalize(item.text).includes(normalize(q));
}

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  const allCount = CATEGORIES.reduce((s,c) => s + c.items.filter(i => matches(i, searchQuery)).length, 0);
  let html = `<div class="sidebar-label">Categorías</div>`;
  html += `<button class="cat-btn ${activeCategory==='all'?'active':''}" onclick="selectCat('all')">
    <span class="cat-dot" style="background:#6b7a9e"></span>Todas
    <span class="cat-count">${allCount}</span></button>`;
  CATEGORIES.forEach(cat => {
    const cnt = cat.items.filter(i => matches(i, searchQuery)).length;
    if (searchQuery && cnt === 0) return;
    html += `<button class="cat-btn ${activeCategory===cat.id?'active':''}" onclick="selectCat('${cat.id}')">
      <span class="cat-dot" style="background:${cat.color}"></span>${cat.label}
      <span class="cat-count">${cnt}</span></button>`;
  });
  sb.innerHTML = html;
}

function renderMain() {
  const main = document.getElementById('main');
  const countEl = document.getElementById('count-num');
  const cats = activeCategory === 'all' ? CATEGORIES : CATEGORIES.filter(c => c.id === activeCategory);
  let total = 0;
  let html = '';
  cats.forEach(cat => {
    const filtered = cat.items.filter(i => matches(i, searchQuery));
    if (!filtered.length) return;
    total += filtered.length;
    html += `<div class="section-title"><span class="section-dot" style="background:${cat.color}"></span>${cat.label}</div>`;
    html += `<div class="items-grid">`;
    filtered.forEach((item, idx) => {
      const uid = cat.id + '_' + idx;
      const isTpl = !!item.isTemplate;
      const safeText = item.text.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      html += `<div class="tip-card${isTpl?' has-template':''}" id="c_${uid}"
        onclick="${isTpl ? `openModal('${safeText}','${uid}')` : `copyItem('${safeText}','${uid}')`}">
        <div class="tip-main"><div class="tip-text">${formatTipText(item.text, searchQuery)}</div></div>
        ${isTpl ? '<span class="template-badge">TICKET</span>' : ''}
        <span class="tip-copy-icon">${isTpl ? '✏️' : '⎘'}</span>
      </div>`;
    });
    html += `</div>`;
  });
  if (!total) {
    html = `<div class="empty"><div class="empty-icon">🔍</div><h3>Sin resultados</h3><p>No hay tipificaciones para "<strong>${escHtml(searchQuery)}</strong>"</p></div>`;
  }
  main.innerHTML = html;
  countEl.textContent = total;
  document.getElementById('result-count').style.display = searchQuery ? 'block' : 'none';
}

function render() { renderSidebar(); renderMain(); }

function selectCat(id) { activeCategory = id; render(); }

function copyItem(text, uid) {
  navigator.clipboard.writeText(text).then(() => {
    const card = document.getElementById('c_' + uid);
    if (card) {
      card.classList.add('copied');
      const icon = card.querySelector('.tip-copy-icon');
      if (icon) { icon.style.opacity='1'; icon.textContent='✓'; }
      setTimeout(() => {
        card.classList.remove('copied');
        if (icon) { icon.style.opacity=''; icon.textContent='⎘'; }
      }, 2000);
    }
    toast('¡Copiado al portapapeles! ✓');
  });
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

function openModal(text, uid) {
  pendingTemplate = { text, uid };
  document.getElementById('ticket-input').value = '';
  document.getElementById('modal-preview').innerHTML = previewHtml(text, '');
  document.getElementById('modal-overlay').classList.add('show');
  setTimeout(() => document.getElementById('ticket-input').focus(), 80);
}

function previewHtml(text, val) {
  const display = val || '<span style="color:var(--muted)">LIST-XXXX</span>';
  if (val) {
    return text.replace('LIST-XXXX', `<span class="filled">${escHtml(val)}</span>`);
  }
  return text.replace('LIST-XXXX', `<span style="color:var(--muted);font-style:italic">LIST-XXXX</span>`);
}

function confirmTicket() {
  if (!pendingTemplate) return;
  const val = document.getElementById('ticket-input').value.trim();
  const final = pendingTemplate.text.replace('LIST-XXXX', val || 'LIST-XXXX');
  navigator.clipboard.writeText(final).then(() => {
    toast(val ? `¡Copiado con ${val}! ✓` : '¡Copiado! ✓');
  });
  closeModal();
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
  pendingTemplate = null;
}

document.getElementById('ticket-input').addEventListener('input', function() {
  if (pendingTemplate) {
    document.getElementById('modal-preview').innerHTML = previewHtml(pendingTemplate.text, this.value.trim());
  }
});
document.getElementById('ticket-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') confirmTicket();
  if (e.key === 'Escape') closeModal();
});
document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.getElementById('search').addEventListener('input', function() {
  searchQuery = this.value.trim();
  activeCategory = 'all';
  render();
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== document.getElementById('search')) {
    e.preventDefault();
    document.getElementById('search').focus();
  }
  if (e.key === 'Escape' && document.activeElement === document.getElementById('search')) {
    document.getElementById('search').blur();
  }
});

render();
