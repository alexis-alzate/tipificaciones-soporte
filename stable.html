<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tipificaciones · Soporte</title>
</head>
<body style="margin:0;background:#0b0d12;color:#e2e8f8;font-family:Arial,sans-serif">
  <div style="padding:24px">Cargando tipificaciones…</div>
  <script>
    (async () => {
      try {
        const source = await fetch('/app.html?v=stable-20260827', { cache: 'no-store' })
          .then(r => { if (!r.ok) throw new Error('No se pudo cargar la aplicación'); return r.text(); });

        // La aplicación ya sincroniza al abrir y después de guardar/modificar.
        // Evitamos el polling de 30 s que re-renderizaba la lista durante el uso.
        const stableSource = source.replace(
          'loadAll();setInterval(loadAll,30000);',
          'loadAll();'
        );

        document.open();
        document.write(stableSource);
        document.close();
      } catch (error) {
        console.error(error);
        document.body.innerHTML = '<div style="padding:24px">No se pudo cargar la herramienta. Recarga la página.</div>';
      }
    })();
  </script>
</body>
</html>
